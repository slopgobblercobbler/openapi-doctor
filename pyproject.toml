[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-doctor"
version = "1.0.0"
description = "Production-grade OpenAPI 3.0 & 3.1 specification linter and automated autofixer"
readme = "README.md"
authors = [
    { name = "slopggobblercobbler81", email = "slopggobblercobbler81@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["openapi", "swagger", "linter", "autofix", "rest-api", "api-linting"]
dependencies = [
    "pyyaml>=5.3",
]
requires-python = ">=3.8"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
openapi-doctor = "openapi_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/openapi-doctor"
Repository = "https://github.com/slopggobblercobbler81/openapi-doctor"
Issues = "https://github.com/slopggobblercobbler81/openapi-doctor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openapi_doctor*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]

[tool.openapi-doctor]
strict = false
format = "text"
