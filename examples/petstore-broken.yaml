openapi: 3.0.3
info:
  title: Sample Pet Store API (Broken)
  version: 1.0.0
  description: An intentionally broken OpenAPI 3.0 specification for testing openapi-doctor.
paths:
  /pets:
    get:
      summary: List all pets
      operationId: getPets
      responses:
        "200":
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        "500": {}
    post:
      summary: Create a pet
      operationId: getPets
      security:
        - BearerAuth: []
      responses:
        "201": {}
        "400":
          description: Bad request
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      items:
        $ref: "#/components/schemas/NonExistentPet"
    OrphanSchema:
      type: object
      properties:
        unusedField:
          type: string
  parameters:
    UnusedQueryParam:
      name: unused
      in: query
      schema:
        type: string
